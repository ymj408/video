spring:
  datasource:
    url: jdbc:h2:mem:luma_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true

app:
  storage:
    upload-dir: ./data/uploads-local
  simulation:
    step-delay-ms: 2200
    fail-stage: NONE
    control-enabled: true

logging:
  level:
    com.lumastudio: INFO
