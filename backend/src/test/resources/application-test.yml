spring:
  datasource:
    url: jdbc:h2:mem:luma_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    clean-disabled: false

app:
  storage:
    upload-dir: ./target/test-uploads
    max-file-size-bytes: 5242880
  simulation:
    step-delay-ms: 0
    fail-stage: NONE
    fail-next-only: true
    control-enabled: true
  jobs:
    core-pool-size: 1
    max-pool-size: 2
    queue-capacity: 20
  recovery:
    fail-unfinished-on-startup: false

logging:
  level:
    root: WARN
    com.lumastudio: INFO
